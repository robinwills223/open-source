{% extends "base.html" %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
  <h2 style="color: var(--danger); margin-bottom: 1rem;">Delete Record</h2>
  <p style="margin-bottom: 1.5rem;">
    Are you sure you want to delete the record <strong>"{{ record.title }}"</strong>? This action cannot be undone.
  </p>

  <form method="post">
    {% csrf_token %}
    <div style="display: flex; gap: 0.75rem;">
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'records:record_detail' record.pk %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
